name: StarCity Builder release and OTA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: starcity-builder-release-ota
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      STAR_CITY_KEYSTORE_PASSWORD: ${{ secrets.STAR_CITY_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore permanent signing key
        id: signing
        env:
          STAR_CITY_KEYSTORE_BASE64: ${{ secrets.STAR_CITY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$STAR_CITY_KEYSTORE_BASE64" ] || [ -z "$STAR_CITY_KEYSTORE_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured. Validation artifacts only; no unsigned release will be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          printf '%s' "$STAR_CITY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/starcity-builder.keystore"
          chmod 600 "$RUNNER_TEMP/starcity-builder.keystore"
          echo "STAR_CITY_KEYSTORE=$RUNNER_TEMP/starcity-builder.keystore" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/starcity-builder.keystore" -storepass:env STAR_CITY_KEYSTORE_PASSWORD > /dev/null
      - name: Test economy and OTA verification
        run: bash tools/ci_tests.sh
      - name: Build optimized native release
        run: bash tools/ci_native.sh
      - name: Build validation APK shell
        run: |
          export OTA_SHELL_HASH="$(python3 tools/shell_hash.py game)"
          export OTA_SEQUENCE="$((GITHUB_RUN_ID * 100 + GITHUB_RUN_ATTEMPT))"
          gradle -p android-shell --no-daemon assembleRelease -PotaUnsigned=true
          cp android-shell/app/build/outputs/apk/release/app-release-unsigned.apk build/starcity-builder-bootstrap-unsigned.apk
          python3 tools/check_shell_apk.py game build/starcity-builder-bootstrap-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: starcity-builder-validation
          path: |
            build/starcity-builder-bootstrap-unsigned.apk
            android-shell/app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
      - name: Build signed APK shell and OTA
        if: steps.signing.outputs.available == 'true'
        run: bash tools/ci_package.sh
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.available == 'true'
        with:
          name: starcity-builder-release-and-ota
          path: |
            build/starcity-builder-release.apk
            build/game-ota/*
          if-no-files-found: error
      - name: Publish APK and OTA channel
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/ci_publish.sh
